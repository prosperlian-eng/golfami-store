name: 新着動画を自動更新
on:
  schedule:
    - cron: "0 21 * * *"   # 毎朝6時(日本時間)
  workflow_dispatch: {}     # 手動実行も可
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/update_latest.py
      - name: 変更があればコミット
        run: |
          git config user.name "golfami-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet assets/latest.json; then
            git add assets/latest.json
            git commit -m "新着動画を自動更新"
            git push
          else
            echo "変更なし"
          fi
